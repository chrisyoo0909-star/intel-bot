name: Autonomous Market Scanner

on:
  schedule:
    # Every 6 hours — keeps total LLM calls within the free-tier daily budget.
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Market Scan
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # Optional: set these repo secrets only to override the Groq defaults.
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_REASONING_EFFORT: ${{ secrets.LLM_REASONING_EFFORT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python run_scan.py
